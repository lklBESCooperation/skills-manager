<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Quick Toggle</title>
    <link rel="stylesheet" href="./skills-ui.css" />
  </head>
  <body>
    <section class="sm-panel-root" data-plugin-panel="skills-quick-toggle">
      <header class="sm-panel-header">
        <div class="sm-panel-title-row">
          <strong>Skills 快捷开关</strong>
          <div class="sm-header-actions">
            <button type="button" class="sm-btn sm-btn-sm" id="panel-refresh-btn">刷新</button>
          </div>
        </div>
        <div class="sm-panel-title-row">
          <span class="sm-badge" id="panel-context-badge">正在检测…</span>
          <button type="button" class="sm-btn sm-btn-primary sm-btn-sm" id="open-workbench">
            打开全幅工作台
          </button>
        </div>
      </header>

      <div id="panel-error-slot"></div>
      <div id="panel-search-slot" hidden></div>
      <div id="panel-list-slot" class="sm-panel-list"></div>
      <footer class="sm-panel-foot" id="panel-foot-slot" hidden></footer>
    </section>

    <script type="module" src="./skills-panel.js"></script>
  </body>
</html>
