<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Manager</title>
    <link rel="stylesheet" href="./skills-ui.css" />
  </head>
  <body>
    <main class="sm-page" data-plugin-page="skills-workbench">
      <header class="sm-header">
        <div class="sm-title-block">
          <div class="sm-title-row">
            <h1 class="sm-title">Skills Manager</h1>
            <span class="sm-badge sm-badge-primary" id="workspace-context-badge">正在检测工作区…</span>
          </div>
          <p class="sm-subtitle">统一管理受管技能、批量操作、Packs 规则包与只读 Plugin 技能审计</p>
        </div>

        <div class="sm-header-actions">
          <nav class="sm-tabs" role="tablist" aria-label="Skills Workbench Sections">
            <button class="sm-tab" type="button" role="tab" aria-selected="true" data-tab="installed">
              <span>已安装技能</span>
              <span class="sm-tab-count" id="tab-count-installed">0</span>
            </button>
            <button class="sm-tab" type="button" role="tab" aria-selected="false" data-tab="packs">
              <span>技能包 (Packs)</span>
              <span class="sm-tab-count" id="tab-count-packs">0</span>
            </button>
            <button class="sm-tab" type="button" role="tab" aria-selected="false" data-tab="plugin-audit">
              <span>Plugin 与审计</span>
              <span class="sm-tab-count" id="tab-count-plugins">0</span>
            </button>
          </nav>
          <button class="sm-btn" type="button" id="workbench-refresh-btn">刷新</button>
        </div>
      </header>

      <div id="global-alert-slot"></div>

      <section class="sm-section" data-panel="installed" role="tabpanel" id="panel-installed"></section>
      <section class="sm-section" data-panel="packs" role="tabpanel" id="panel-packs" hidden></section>
      <section class="sm-section" data-panel="plugin-audit" role="tabpanel" id="panel-plugin-audit" hidden></section>
    </main>

    <div class="sm-toast-stack" id="toast-stack" aria-live="polite"></div>
    <script type="module" src="./skills-page.js"></script>
  </body>
</html>
